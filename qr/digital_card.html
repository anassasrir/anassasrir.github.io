<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Anass Asrir — Digital Card</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      width: 1080px;
      height: 1920px;
      background: #08090b;
      font-family: 'Inter', -apple-system, sans-serif;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      position: relative;
      overflow: hidden;
    }
    /* Ambient Glows */
    .glow-1 {
      position: absolute;
      top: 15%;
      left: 50%;
      transform: translateX(-50%);
      width: 800px;
      height: 800px;
      background: radial-gradient(circle, rgba(94, 106, 210, 0.22) 0%, transparent 65%);
      pointer-events: none;
    }
    .glow-2 {
      position: absolute;
      bottom: 10%;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 600px;
      background: radial-gradient(circle, rgba(56, 189, 248, 0.15) 0%, transparent 70%);
      pointer-events: none;
    }
    /* Grid */
    .grid {
      position: absolute;
      inset: 0;
      background-image: linear-gradient(rgba(255, 255, 255, 0.03) 1px, transparent 1px),
                        linear-gradient(90deg, rgba(255, 255, 255, 0.03) 1px, transparent 1px);
      background-size: 60px 60px;
      mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 80%);
      -webkit-mask-image: radial-gradient(circle at 50% 50%, black 40%, transparent 80%);
    }

    /* Card Frame */
    .card {
      position: relative;
      z-index: 10;
      width: 840px;
      background: rgba(18, 20, 26, 0.75);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 44px;
      padding: 60px 50px 50px;
      backdrop-filter: blur(40px);
      box-shadow: 0 40px 100px rgba(0, 0, 0, 0.8),
                  inset 0 1px 0 rgba(255, 255, 255, 0.15);
      display: flex;
      flex-direction: column;
      align-items: center;
      text-align: center;
    }

    /* Top Kicker */
    .kicker {
      font-family: 'JetBrains Mono', monospace;
      font-size: 20px;
      font-weight: 600;
      letter-spacing: 0.2em;
      text-transform: uppercase;
      color: #38bdf8;
      margin-bottom: 30px;
      display: flex;
      align-items: center;
      gap: 12px;
    }
    .kicker-dot {
      color: #22c55e;
      font-size: 14px;
      animation: pulse 2s infinite;
    }

    /* Photo */
    .photo-wrap {
      width: 220px;
      height: 220px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(94, 106, 210, 0.3) 0%, rgba(15, 17, 23, 0.8) 70%);
      border: 2px solid rgba(255, 255, 255, 0.15);
      box-shadow: 0 16px 40px rgba(0, 0, 0, 0.6);
      display: flex;
      align-items: flex-end;
      justify-content: center;
      overflow: hidden;
      margin-bottom: 30px;
    }
    .photo-img {
      width: 100%;
      height: 100%;
      object-fit: contain;
      object-position: center bottom;
    }

    /* Name & Role */
    .name {
      font-size: 58px;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1.05;
      background: linear-gradient(180deg, #ffffff 40%, #cbd5e1 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      margin-bottom: 12px;
    }
    .role {
      font-family: 'JetBrains Mono', monospace;
      font-size: 22px;
      font-weight: 600;
      color: #94a3b8;
      background: rgba(255, 255, 255, 0.04);
      border: 1px solid rgba(255, 255, 255, 0.08);
      padding: 8px 24px;
      border-radius: 9999px;
      margin-bottom: 44px;
    }

    /* QR Code Container */
    .qr-box {
      width: 440px;
      height: 440px;
      background: #ffffff;
      border-radius: 32px;
      padding: 24px;
      box-shadow: 0 20px 50px rgba(0, 0, 0, 0.5);
      display: flex;
      align-items: center;
      justify-content: center;
      margin-bottom: 36px;
    }
    .qr-img {
      width: 100%;
      height: 100%;
      display: block;
    }

    /* URL / Scan Instruction */
    .url-badge {
      display: flex;
      align-items: center;
      gap: 12px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 24px;
      font-weight: 600;
      color: #f8fafc;
      background: rgba(255, 255, 255, 0.06);
      border: 1px solid rgba(255, 255, 255, 0.12);
      padding: 14px 32px;
      border-radius: 16px;
      margin-bottom: 16px;
    }
    .scan-hint {
      font-size: 18px;
      color: #64748b;
      letter-spacing: 0.02em;
    }

    /* Footer Branding */
    .brand-foot {
      position: absolute;
      bottom: 50px;
      font-family: 'JetBrains Mono', monospace;
      font-size: 16px;
      color: #475569;
      letter-spacing: 0.1em;
    }
  </style>
</head>
<body>
  <div class="glow-1"></div>
  <div class="glow-2"></div>
  <div class="grid"></div>

  <div class="card">
    <div class="kicker">
      <span class="kicker-dot">●</span>
      <span>Portfolio & Projets Tech</span>
    </div>

    <div class="photo-wrap">
      <img src="../anass-bw-transparent.png" class="photo-img" alt="Anass Asrir" />
    </div>

    <h1 class="name">Anass Asrir</h1>
    <div class="role">Senior QA Engineer | Test Automation</div>

    <div class="qr-box">
      <img src="qrcode-light.png" class="qr-img" alt="QR Code Portfolio" />
    </div>

    <div class="url-badge">
      <span>🔗</span>
      <span>anassasrir.github.io</span>
    </div>

    <p class="scan-hint">Scannez pour explorer le parcours, stacks & démos</p>
  </div>

  <div class="brand-foot">© 2026 ANASS ASRIR • SCAN WITH CAMERA</div>
</body>
</html>
